<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="orbit" x1="10" y1="10" x2="86" y2="86" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8F6FF"/>
      <stop offset="1" stop-color="#C4A3FF"/>
    </linearGradient>
    <filter id="softGlow" x="0" y="0" width="96" height="96" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#softGlow)">
    <circle cx="48" cy="48" r="25" stroke="url(#orbit)" stroke-width="2.4"/>

    <ellipse cx="48" cy="48" rx="35" ry="14" stroke="url(#orbit)" stroke-width="2.4"/>
    <ellipse cx="48" cy="48" rx="35" ry="14" transform="rotate(60 48 48)" stroke="url(#orbit)" stroke-width="2.4"/>
    <ellipse cx="48" cy="48" rx="35" ry="14" transform="rotate(-60 48 48)" stroke="url(#orbit)" stroke-width="2.4"/>

    <circle cx="20" cy="40" r="3.6" fill="#F8F6FF"/>
    <circle cx="76" cy="58" r="3.6" fill="#F8F6FF"/>
  </g>
</svg>